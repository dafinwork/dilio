<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Kaos Dilio</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect for HashRouter
      // Redirects non-hash URLs (e.g. /admin, /koleksi-kaos) to hash URLs (/#/admin, /#/koleksi-kaos)
      var l = window.location;
      var route = l.pathname.replace(/^\/+/, '');
      if (route) {
        l.replace(l.protocol + '//' + l.host + '/#/' + route + (l.search || '') + (l.hash || ''));
      } else {
        l.replace(l.protocol + '//' + l.host + '/' + (l.search || '') + (l.hash || ''));
      }
    </script>
  </head>
  <body>
  </body>
</html>
